<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Editor layout area assy: layout BEFORE dan AFTER, alur jalan operator, simulasi, unduh PNG/SVG/video.">
<meta name="theme-color" content="#0d7a49">
<meta property="og:title" content="Layout Area Assy">
<meta property="og:description" content="Editor layout BEFORE / AFTER dan simulasi alur operator.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2319643F'/%3E%3Crect x='10' y='18' width='44' height='28' rx='3' fill='none' stroke='white' stroke-width='4'/%3E%3Crect x='15' y='23' width='10' height='18' fill='%23FFC400'/%3E%3Crect x='29' y='31' width='20' height='10' fill='%231E2864'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Editor Layout Area Assy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style id="app-css">
/* Layout: full-screen workbench — header with BEFORE/AFTER tabs, canvas in the middle, a context bar for the selected item, a thumb toolbar, and bottom sheets. */
:root{
  --bg:#e9eeea; --panel:#ffffff; --ink:#15201a; --muted:#5b6a61; --line:#d3dcd6;
  --accent:#0d7a49; --accent-ink:#ffffff; --danger:#c62f22; --stage:#c9d4cd; --chip:#e1e9e4; --sel:#f5b800;
  --before:#d8382b; --after:#11904f;
  --ui:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --panel:#17201b; --ink:#e5eee8; --muted:#98a99f; --line:#2a3731;
  --accent:#35c27e; --accent-ink:#04130b; --danger:#ff6a5c; --stage:#0a0f0c; --chip:#22302a; --sel:#ffcc33;
  --before:#ff6a5c; --after:#35c27e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#17201b; --ink:#e5eee8; --muted:#98a99f; --line:#2a3731;
  --accent:#35c27e; --accent-ink:#04130b; --danger:#ff6a5c; --stage:#0a0f0c; --chip:#22302a; --sel:#ffcc33;
  --before:#ff6a5c; --after:#35c27e; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.hdr{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:18px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-doc="before"][aria-pressed="true"]{color:var(--before)}
.seg button[data-doc="after"][aria-pressed="true"]{color:var(--after)}
.ib{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ib:disabled{opacity:.35}
.ib svg,.tb svg,.cb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.zoom{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.zoom .sep{height:4px}
.hint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;font-size:13.5px;line-height:1.3;color:var(--ink);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);padding:7px 11px;border-radius:10px;pointer-events:none;max-width:calc(100% - 90px)}
.zbadge{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;font-size:12.5px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;pointer-events:none}
.ctx{display:flex;align-items:center;gap:6px;background:var(--panel);border-top:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.ctx .nm{flex:1;min-width:84px;display:flex;flex-direction:column;line-height:1.15}
.ctx .nm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .nm small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;min-width:42px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;cursor:pointer;flex:none}
.cb.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cb.dng{color:var(--danger)}
.cb[aria-pressed="true"]{background:var(--sel);color:#1a1300;border-color:var(--sel)}
.tbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.tb:disabled{opacity:.35}
.tb.primary{background:var(--accent);color:var(--accent-ink)}
.tb[aria-expanded="true"]{background:var(--chip)}
.tb.primary[aria-expanded="true"]{background:var(--accent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.25);max-height:52%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sh-h{display:flex;align-items:center;gap:10px;padding-block:6px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sh-h b{flex:1;font-size:19px}
.sh-b{overflow:auto;overscroll-behavior:contain;padding-block:6px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grp{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.grid-add{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.add-it{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:700;text-align:center;cursor:pointer;line-height:1.15}
.add-it svg{width:78px;height:46px;background:#19643f;border-radius:7px}
.fld{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld>label,.fld .lb{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.fld .lb output,.fld>label output{color:var(--ink);font-variant-numeric:tabular-nums}
.fld textarea,.fld input[type=text],.fld input[type=number],.fld select{font:16px var(--ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;box-sizing:border-box}
.fld textarea{min-height:66px;resize:vertical;font-weight:600}
.fld input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.stp{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}
.stp button{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.sw input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:2px}
.sw .none{width:auto;border-radius:17px;padding:0 12px;font-size:13px;font-weight:700;background:var(--bg);color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:600;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important}
.tog input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);padding:11px 13px;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.4}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left;display:flex;flex-direction:column;gap:2px}
.menu .btn small{font-weight:500;color:var(--muted);font-size:13px}
.menu .btn.pri small{color:inherit;opacity:.85}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin:6px 0 0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.li[aria-current="true"]{background:color-mix(in srgb,var(--sel) 22%,transparent)}
.li .sw0{width:30px;height:22px;border-radius:5px;flex:none;border:1px solid var(--line)}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.li .tx b{font-size:15px}
.li .tx small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lk{width:38px;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;display:grid;place-items:center;cursor:pointer}
.li .lk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.li .lk[aria-pressed="true"]{background:var(--sel);color:#1a1300;border-color:var(--sel)}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px 6px 8px;font-weight:700;font-size:13.5px;cursor:pointer;max-width:42vw;flex:none}
.who svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.empty{border-style:dashed;color:var(--muted)}
.ro{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:var(--before);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
.simbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center}
.simbar .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:86px;text-align:right}
.big{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.big svg{width:26px;height:26px;fill:currentColor;stroke:none}
.prog{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.log{display:flex;flex-direction:column;gap:4px;font-size:14px}
.log div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:5px}
.log span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#cv.playing .walk-dash{animation:march .9s linear infinite}
@keyframes march{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){#cv.playing .walk-dash{animation:none}}
.preview img{width:100%;border-radius:8px;border:1px solid var(--line)}
body.sheet-open .toast{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:11px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:430px){.brand span{display:none}.brand b{font-size:16px}}
@media (min-width:760px){.sheet{left:auto;right:16px;bottom:16px;top:76px;width:390px;border-radius:18px;max-height:none}.sheet::before{display:none}.toast{bottom:40px}body.sheet-open .zoom{right:420px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.5}}}
</style>
</head>
<body>
<template id="shell">
<header class="hdr">
  <div class="brand"><b>Layout Area Assy</b><span id="sub">Belum pernah disimpan</span></div>
  <button class="who empty" id="b-who" type="button" aria-label="Nama pengedit"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="who-name">Isi nama</span></button>
  <div class="seg" role="group" aria-label="Pilih layout">
    <button type="button" data-doc="before" aria-pressed="true">BEFORE</button>
    <button type="button" data-doc="after" aria-pressed="false">AFTER</button>
  </div>
</header>
<main class="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="Kanvas layout"></svg>
  <div class="hint" id="hint"></div>
  <div class="zbadge" id="zbadge">100%</div>
  <div class="ro" id="ro" hidden>BEFORE hanya untuk dilihat · edit di AFTER</div>
  <div class="zoom">
    <button class="ib" id="b-undo" type="button" aria-label="Urungkan" title="Urungkan"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="b-redo" type="button" aria-label="Ulangi" title="Ulangi"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="sep"></div>
    <button class="ib" id="b-zin" type="button" aria-label="Perbesar" title="Perbesar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-5-5"/></svg></button>
    <button class="ib" id="b-zout" type="button" aria-label="Perkecil" title="Perkecil"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></svg></button>
    <button class="ib" id="b-fit" type="button" aria-label="Tampilkan semua" title="Tampilkan semua"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="sep"></div>
    <button class="ib" id="b-pan" type="button" aria-pressed="false" aria-label="Mode geser layar" title="Mode geser layar"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-8a1.5 1.5 0 0 1 3 0V12M14 6.5a1.5 1.5 0 0 1 3 0V12M17 8.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-5.2-3L4.5 14a1.5 1.5 0 0 1 2.6-1.5L8 14"/></svg></button>
    <button class="ib" id="b-snap" type="button" aria-pressed="true" aria-label="Rapikan ke grid" title="Rapikan ke grid"><svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></svg></button>
  </div>
</main>
<div class="ctx" id="ctx" hidden>
  <div class="nm"><b id="ctx-name">Item</b><small id="ctx-sub"></small></div>
  <button class="cb pri" type="button" data-c="edit"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Edit</button>
  <button class="cb" type="button" data-c="lock" aria-pressed="false" aria-label="Kunci posisi" title="Kunci posisi"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <button class="cb" type="button" data-c="dup" aria-label="Duplikat" title="Duplikat"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
  <button class="cb dng" type="button" data-c="del" aria-label="Hapus" title="Hapus"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  <button class="cb" type="button" data-c="x" aria-label="Batal pilih" title="Batal pilih"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<nav class="tbar" aria-label="Alat">
  <button class="tb primary" id="t-add" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah</button>
  <button class="tb" id="t-list" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Daftar item</button>
  <button class="tb" id="t-sim" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>Simulasi</button>
  <button class="tb" id="t-more" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Simpan &amp; unduh</button>
</nav>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="sh-title">
  <div class="sh-h"><b id="sh-title">Tambah</b><button class="ib" id="sh-x" type="button" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-b" id="sh-body"></div>
</section>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="f-import" accept=".json,application/json" hidden>
</template>
<div id="app"></div>
<script type="application/json" id="layout-data">null</script>
<script id="app-js">
(function(){
'use strict';
const FONT_LINK='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap">';
const LF='Poppins,"Segoe UI",Arial,sans-serif';
const BOXLIKE=['box','table','shelf','rack','pallet','gv','cart','agv','op','text'];
const POLY=['road','wall','arrow','walk'];
const SW=['#FFFFFF','#000000','#FFC400','#0A2AA8','#1E2864','#373E7D','#20A864','#19643F','#FF3B30','#FF8C00','#B9C3BE','#123CEA'];
const $=id=>document.getElementById(id);

/* ---------- default layouts, redrawn from the user's BEFORE/AFTER picture ---------- */
const nid=()=>'i'+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);

function fitBoard(){const items=D().items;if(!items.length)return;let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;items.forEach(it=>{const b=bbox(it);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h)});const m=30;mutate(()=>{Object.assign(D().board,{x:Math.round(x1-m),y:Math.round(y1-m),w:Math.round(x2-x1+2*m),h:Math.round(y2-y1+2*m)})},true);fit();openBoard();toast('Papan disesuaikan ke isi')}

/* ---------- simulation: operators walk along their dashed routes ---------- */
let simG=null,simOn=false,simPlay=false,simT=0,simSpeed=1,simRaf=0,simLast=0,simRec=false;
const walks=()=>D().items.filter(i=>i.t==='walk'&&i.pts&&i.pts.length>1);
function simLetters(){return new Set(walks().map(w=>w.letter).filter(Boolean))}
function walkCycle(w){const tr=polyLen(w.pts)/Math.max(1,w.speed||80);return tr+(w.wait||0)+(w.back?tr:0)}
function simTotal(){let T=0;walks().forEach(w=>{T=Math.max(T,(w.delay||0)+walkCycle(w))});return Math.max(2,T)+0.8}
function along(pts,d){for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=dist(a,b);if(d<=L||i===pts.length-1){const f=L?Math.min(1,Math.max(0,d/L)):0;return {p:[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],ang:Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI}}d-=L}return {p:pts[pts.length-1],ang:0}}
function walkPos(w,t){

  if(lt<tr){const r=along(w.pts,lt*v);return {p:r.p,ang:r.ang,moving:true}}
  if(!w.back||lt<tr+(w.wait||0)){const r=along(w.pts,L);return {p:r.p,ang:r.ang,moving:false}}
  const bt=lt-tr-(w.wait||0);
  if(bt<tr){const r=along(w.pts,L-bt*v);return {p:r.p,ang:r.ang+180,moving:true}}
  const r=along(w.pts,0);return {p:r.p,ang:r.ang+180,moving:false};

function opLook(letter){const o=D().items.find(i=>i.t==='op'&&i.letter===letter);return o?{fill:o.fill,tc:o.tc,w:o.w}:{fill:'#123CEA',tc:'#FFC400',w:64}}

function simTick(now){

let vidRes=1280;
async function simRecord(btn){

  const mime=mimes.find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(_){return false}});

  simRec=true;btn.disabled=true;st.textContent='Menyiapkan gambar...';

    const letters=simLetters(),bg=await renderCanvas({width:vidRes,even:true,transparent:false,hideLetters:letters,caption:false});
    const b=D().board,W=bg.width,Hh=bg.height,k=W/b.w;

    const sprites=[];

      const img=await loadImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-lk.w*0.8} ${-lk.w*0.8} ${lk.w*1.6} ${lk.w*1.6}" width="${size}" height="${size}"><circle r="${lk.w*0.5}" fill="${w.c}" opacity=".25"/>${inner({t:'op',w:lk.w,h:lk.w,letter:'',fill:lk.fill,tc:lk.tc})}</svg>`);

    const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
    const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:W>1500?9e6:6e6}),chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const done=new Promise(res=>rec.onstop=res);
    const total=simTotal(),nm=editorName(),fs=Math.round(W*0.016);
    const frame=t=>{x.drawImage(bg,0,0);
      sprites.forEach(({w,img,size,lk})=>{const q=walkPos(w,t);x.save();x.translate((q.p[0]-b.x)*k,(q.p[1]-b.y)*k);x.rotate(q.ang*Math.PI/180);x.drawImage(img,-size/2,-size/2,size,size);
        if(w.letter){const u=lk.w/80*k,f=(String(w.letter).length>1?13:23)*u,oy=-1.5*u+f*0.06;x.font=`700 ${f}px Poppins, "Segoe UI", Arial, sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=2.4*u;x.strokeStyle='#05145A';x.strokeText(w.letter,0,oy);x.fillStyle=lk.tc||'#FFC400';x.fillText(w.letter,0,oy)}x.restore()});
      x.save();x.font=`700 ${fs}px Poppins, "Segoe UI", Arial, sans-serif`;const lab='SIMULASI ALUR OPERATOR · LAYOUT '+cur.toUpperCase();const tw=x.measureText(lab).width;
      x.fillStyle='rgba(8,14,42,.8)';x.beginPath();if(x.roundRect)x.roundRect(fs*0.8,fs*0.8,tw+fs*1.4,fs*2,fs*0.5);else x.rect(fs*0.8,fs*0.8,tw+fs*1.4,fs*2);x.fill();x.fillStyle='#FFFFFF';x.textBaseline='middle';x.fillText(lab,fs*1.5,fs*1.8+fs*0.04);
      const r=(Math.min(t,total)).toFixed(1)+' dtk'+(nm?'  ·  '+nm:'');x.font=`600 ${Math.round(fs*0.85)}px Poppins, "Segoe UI", Arial, sans-serif`;const rw=x.measureText(r).width;x.fillStyle='rgba(8,14,42,.8)';x.beginPath();if(x.roundRect)x.roundRect(W-rw-fs*2.2,Hh-fs*2.8,rw+fs*1.4,fs*2,fs*0.5);else x.rect(W-rw-fs*2.2,Hh-fs*2.8,rw+fs*1.4,fs*2);x.fill();x.fillStyle='#FFFFFF';x.fillText(r,W-rw-fs*1.5,Hh-fs*1.8);x.restore()};

    rec.stop();await done;stream.getTracks().forEach(t=>t.stop());

  }catch(e){toast('Video gagal direkam, coba ukuran HD');st.textContent='Gagal merekam, coba lagi'}
  simRec=false;btn.disabled=false;pg.style.width='0';
}

function exportSvg(transparent){
  const d=D(),b=d.board;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" width="${b.w}" height="${b.h}">${DEFS}${transparent?'':`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${b.bg}"/>`}${d.items.map(i=>itemSvg(i,false)).join('')}</svg>`;
}
let pngRes=4000,pngTransparent=false,pngCaption=true;
function pngDims(res,even){const b=D().board;let W=res||pngRes,Hh=Math.round(b.h*W/b.w);const max=16e6;if(W*Hh>max){const f=Math.sqrt(max/(W*Hh));W=Math.floor(W*f);Hh=Math.floor(Hh*f)}if(even){W-=W%2;Hh-=Hh%2}return [W,Hh]}

async function renderCanvas(o){
  try{await Promise.all([document.fonts.load('700 40px Poppins'),document.fonts.load('600 40px Poppins'),document.fonts.load('500 40px Poppins')])}catch(_){}
  const d=D(),b=d.board,[W,Hh]=pngDims(o.width,o.even),k=W/b.w;
  const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
  if(!o.transparent){x.fillStyle=b.bg;x.fillRect(0,0,W,Hh)}

  // shapes are rasterised from SVG in batches; every text is drawn on the canvas in z-order so it keeps the real Poppins font at full resolution
  const batches=[];let run=[];
  d.items.filter(it=>!(hide&&it.t==='op'&&hide.has(it.letter))).forEach(it=>{if(it.t==='text'){if(run.length){batches.push({items:run});run=[]}batches.push({text:it})}else run.push(it)});
  if(run.length)batches.push({items:run});
  for(const bt of batches){
    if(bt.items){const rr=[];const body=bt.items.map(i=>itemSvg(i,false,rr)).join('');
      const img=await loadImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" width="${W}" height="${Hh}">${DEFS}${body}</svg>`);
      x.drawImage(img,0,0,W,Hh);rr.forEach(r=>drawRun(x,r,b,k));}
    else drawRun(x,{kind:'text',it:bt.text,z:textSize(bt.text)},b,k);
  }
  if(o.caption)drawCaption(x,W,Hh,o.title);
  return c;
}
function drawCaption(x,W,Hh,title){

  const parts=[title||('Layout '+cur.toUpperCase()),nm?('Diedit oleh '+nm):'',when].filter(Boolean);const t=parts.join('  ·  ');
  const fs=Math.max(14,Math.round(W*0.011));x.save();x.font=`600 ${fs}px Poppins, "Segoe UI", Arial, sans-serif`;

  if(m==='sim-restart'){simT=0;if(!simOn)simStart();simDraw();return}
  if(m==='addwalk'){closeSheet();addItem('Alur operator A');return}
  if(m==='name-ok'){const v=($('f-name').value||'').trim();if(!v){toast('Tulis nama dulu');return}setEditorName(v);toast('Nama disimpan: '+v);const a=nameAfter;nameAfter=null;if(a)a();else closeSheet();return}
  if(m==='board'){openBoard();return}
  if(m==='video'){simRecord(btn);return}
  if(m==='png'){btn.disabled=true;const sm=btn.querySelector('small'),old=sm.textContent;sm.textContent='Membuat gambar...';try{const bl=await exportPng();await saveFile(`layout-${cur}-${stamp()}.png`,bl,true)}catch(e){toast('Gambar gagal dibuat, coba ukuran lebih kecil')}btn.disabled=false;sm.textContent=old;return}
  if(m==='svg'){await saveFile(`layout-${cur}-${stamp()}.svg`,new Blob([exportSvg(pngTransparent)],{type:'image/svg+xml'}));return}
  if(m==='json'){await saveFile(`layout-assy-${stamp()}.json`,new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));return}
  if(m==='import'){$('f-import').click();return}
  if(m==='who'){openName(openMenu);return}
  if(m==='reset'){if(RO())return;if(btn.dataset.armed){const before=JSON.stringify(D());S.docs[cur]=defAfter();pushHist(before,true);saveDraft();desel();render();fit();closeSheet();toast('Layout '+cur.toUpperCase()+' dikembalikan')}else{btn.dataset.armed='1';btn.querySelector('span').textContent='Ketuk sekali lagi untuk mengembalikan'}return}
  if(m==='publish'){if(!editorName()){openName(openMenu);toast('Isi nama pengedit sebelum menyimpan');return}
    if(!art){const now=Date.now();S.savedAt=now;S.meta={editor:editorName(),at:now};S.log=[{n:editorName(),at:now}].concat(S.log||[]).slice(0,30);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}updWho();toast('Tersimpan di perangkat ini');openMenu();return}
    btn.disabled=true;const sm=btn.querySelector('small');sm.textContent='Menyimpan...';
    try{const now=Date.now();S.savedAt=now;S.meta={editor:editorName(),at:now};S.log=[{n:editorName(),at:now}].concat(S.log||[]).slice(0,30);await art.publish(buildDoc());try{localStorage.removeItem(KEY)}catch(_){}toast('Tersimpan ke halaman')}
    catch(e){const c=e&&e.code;if(c==='not_writer'||c==='not_granted'){readOnly=true;toast('Tampilan ini hanya-baca. Simpan PNG untuk berbagi.')}else if(c==='conflict')toast('Ada versi lebih baru, halaman dimuat ulang');else toast('Belum tersimpan, coba lagi sebentar');btn.disabled=readOnly;sm.textContent=readOnly?'Tampilan ini hanya-baca':'Coba lagi'}
    return}
}
function buildDoc(){
  const C='<'+'/';
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>'+document.title+C+'title>\n'+FONT_LINK+'\n'
   +'<style id="app-css">'+$('app-css').textContent+C+'style>\n'
   +'<template id="shell">'+$('shell').innerHTML+C+'template>\n<div id="app">'+C+'div>\n'
   +'<script type="application/json" id="layout-data">'+json+C+'script>\n'
   +'<script id="app-js">'+$('app-js').textContent+C+'script>'+C+'body>'+C+'html>';
}
function editorName(){try{return localStorage.getItem(NKEY)||''}catch(_){return ''}}
function setEditorName(v){try{localStorage.setItem(NKEY,v)}catch(_){}updWho()}
function fmtTime(t){try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
function updWho(){const nm=editorName(),b=$('b-who');$('who-name').textContent=nm||'Isi nama';b.classList.toggle('empty',!nm);
  const m=S.meta||{};$('sub').textContent=m.editor?('Disimpan oleh '+m.editor+' · '+fmtTime(m.at)):'Belum pernah disimpan'}
function openName(after){
  const h=`<div class="fld"><label for="f-name">Nama pengedit</label><input type="text" id="f-name" value="${esc(editorName())}" maxlength="40" placeholder="Contoh: Rina – Produksi" autocomplete="name"><p class="note">Nama ini dicatat setiap kali layout disimpan dan bisa dicantumkan di gambar atau video.</p></div><div class="acts"><button class="btn pri" type="button" data-menu="name-ok">Simpan nama</button></div>`;
  openSheet('Nama pengedit',h,'name');nameAfter=after||null;setTimeout(()=>{const f=$('f-name');if(f)f.focus()},60);
}
let nameAfter=null;
let toastT=0;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

/* ---------- boot ---------- */
function switchDoc(d){if(d===cur)return;simStop(true);cur=d;desel();closeSheet();document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.doc===d));render();fit();updBtns();updRO()}
function updRO(){const ro=RO();$('ro').hidden=!ro;['t-add','t-list'].forEach(i=>$(i).disabled=ro);hint()}
function toggle(kind,fn){sheetKind===kind?closeSheet():fn()}
function boot(){
  $('app').appendChild($('shell').content.cloneNode(true));
  loadInitial();
  svg=$('cv');svg.innerHTML=DEFS+'<rect id="board"/><g id="items"></g><g id="sim"></g><g id="ui"></g>';
  boardR=svg.querySelector('#board');itemsG=svg.querySelector('#items');uiG=svg.querySelector('#ui');simG=svg.querySelector('#sim');
  svg.addEventListener('pointerdown',onDown);svg.addEventListener('pointermove',onMove);svg.addEventListener('pointerup',onUp);svg.addEventListener('pointercancel',onUp);
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=sp(e);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>switchDoc(b.dataset.doc)));
  $('b-undo').onclick=undo;$('b-redo').onclick=redo;$('b-fit').onclick=fit;$('b-zin').onclick=()=>zoomAt(1.3);$('b-zout').onclick=()=>zoomAt(1/1.3);
  $('b-pan').onclick=()=>{panMode=!panMode;$('b-pan').setAttribute('aria-pressed',panMode);hint();toast(panMode?'Mode geser layar aktif':'Mode edit aktif')};
  $('b-snap').onclick=()=>{snap=!snap;$('b-snap').setAttribute('aria-pressed',snap);toast(snap?'Rapikan ke grid: aktif':'Rapikan ke grid: mati')};
  $('t-add').onclick=()=>toggle('add',openAdd);$('t-list').onclick=()=>toggle('list',openList);$('t-sim').onclick=()=>toggle('sim',openSim);$('b-who').onclick=()=>openName();$('t-more').onclick=()=>toggle('menu',openMenu);
  $('ctx').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
    if(c==='edit')toggle('props',()=>openProps());else if(c==='lock'){setProp('lock',!find(sel).lock);refreshSheet();toast(find(sel).lock?'Item dikunci':'Kunci dibuka')}
    else if(c==='dup')act('dup');else if(c==='del')act('del');else if(c==='x'){desel();if(sheetKind==='props')closeSheet()}});
  $('sh-x').onclick=closeSheet;
  $('sh-body').addEventListener('input',onSheetInput);$('sh-body').addEventListener('change',onSheetInput);$('sh-body').addEventListener('click',onSheetClick);
  $('sh-body').addEventListener('keydown',e=>{if(e.target.id==='f-name'&&e.key==='Enter'){e.preventDefault();const b=$('sh-body').querySelector('[data-menu=name-ok]');if(b)b.click();return}const li=e.target.closest('[data-li]');if(li&&e.target===li&&(e.key==='Enter'||e.key===' ')){e.preventDefault();li.click()}});
  $('f-import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.docs||!o.docs.before||!o.docs.after)throw 0;H.before={u:[JSON.stringify(S.docs.before)],r:[]};H.after={u:[JSON.stringify(S.docs.after)],r:[]};S=o;saveDraft();desel();render();fit();closeSheet();toast('Proyek dibuka')}catch(_){toast('File ini bukan proyek layout yang valid')}};r.readAsText(f);e.target.value=''});
  document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if((e.key==='Delete'||e.key==='Backspace')&&sel){act('del');e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.shiftKey?redo():undo();e.preventDefault()}if(e.key==='Escape'){closeSheet();desel()}});
  new ResizeObserver(()=>applyView()).observe(svg);
  render();fit();updBtns();updRO();updWho();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
  window.layoutEditor={exportPng:async(doc,res)=>{if(doc)switchDoc(doc);if(res)pngRes=res;return exportPng()},sim:t=>{simT=t;simDraw()}};
}
boot();
})();
